<!DOCTYPE html>
<html lang="en">

{% include head.html %}

<!-- hack iOS CSS :active style -->
<body ontouchstart="">

    {% include nav.html %}
    {% include search.html %}

    {{ content }}

    {% include footer.html %}


<!-- Image to hack wechat -->
<img src="{{ site.baseurl }}/img/icon_wechat.png" width="0" height="0" />
<!-- Migrate from head to bottom, no longer block render and still work -->

<script type="module">
    import mermaid from "https://cdn.jsdelivr.net/npm/mermaid@10/dist/mermaid.esm.min.mjs";

    mermaid.initialize({
        startOnLoad: true
    });

    // convert fenced code blocks produced by kramdown ("language-mermaid")
    // into elements that mermaid recognizes (.mermaid on a container element).
    // kramdown escapes characters inside <code>, so we replace the entire block
    // and set textContent with the raw code text to avoid HTML entities.

    function convertMermaidBlocks() {
        document.querySelectorAll('pre > code.language-mermaid').forEach(code => {
            const text = code.textContent || '';
            const pre = code.parentElement;
            if (!pre) return;

            // create a div to hold mermaid source
            const mermaidDiv = document.createElement('div');
            mermaidDiv.className = 'mermaid';
            mermaidDiv.textContent = text;

            pre.parentNode.replaceChild(mermaidDiv, pre);
        });
    }

    document.addEventListener('DOMContentLoaded', () => {
        convertMermaidBlocks();
    });
</script>

</body>

</html>
